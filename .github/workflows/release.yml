name: release

# Cut a release by pushing a version tag, e.g.:
#   git tag v0.1.1 && git push origin v0.1.1
#
# Builds the Linux, Windows and macOS installers and attaches them to a DRAFT
# GitHub Release. Publishing the draft is a manual step.
#
# Three jobs. `build` (Linux + Windows, one ubuntu runner) and `build-mac` hand
# their output up as workflow artifacts; `release` collects both and creates the
# release. macOS cannot be cross-built (hdiutil, codesign). Windows can: Wine
# runs rcedit on the Linux host.
#
# Aventurine Prism has no native modules, so there is no ABI to park and no
# postinstall step to worry about.
#
# IN-APP UPDATES read this release. Installed copies (electron/updater.js) look
# at the latest PUBLISHED release, so publishing the draft is also what offers
# the update to every Windows and Linux user, and is what macOS users are told
# about. Windows and Linux copies need the metadata files attached alongside
# the installers: latest.yml (Windows), latest-linux.yml (AppImage, deb and rpm)
# and the .blockmap files used for differential downloads. If a platform's
# metadata is missing, its installed copies report a failed check instead of
# updating. Re-running the workflow attaches it, the same as for a missing .exe.
on:
  push:
    tags:
      - 'v*'

# Read-only by default. Only `release` writes, and it asks for that itself.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: electron/package-lock.json

      # Best-effort, like the Windows build below: a Wine problem must not stop
      # the Linux installers. `wine` itself is load-bearing (electron-builder
      # spawns the plain binary; wine64 does not provide it).
      - name: Install Wine (Windows cross-build toolchain)
        continue-on-error: true
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends wine wine64 wine32
          wine --version

      - name: Install dependencies
        working-directory: electron
        run: npm ci

      - name: Build Linux installers
        working-directory: electron
        run: npm run dist:linux -- --publish never

      - name: Build Windows installer
        continue-on-error: true
        working-directory: electron
        run: npm run dist:win -- --publish never

      # Hand the installers and the update metadata to the `release` job.
      # `if: always()` so the Linux files still upload when the Windows step
      # failed. latest-linux.yml is one file covering all three Linux packages;
      # latest.yml is Windows'.
      - name: Upload installers as artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prism-installers-${{ github.ref_name }}
          path: |
            electron/dist/*.AppImage
            electron/dist/*.rpm
            electron/dist/*.deb
            electron/dist/*.exe
            electron/dist/*.blockmap
            electron/dist/latest.yml
            electron/dist/latest-linux.yml
          if-no-files-found: error

  # Best-effort: a failure here costs the release its .dmg and nothing else.
  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: electron/package-lock.json

      - name: Install dependencies
        working-directory: electron
        run: npm ci

      # Ad-hoc signed, not notarized (no Apple Developer ID). Gatekeeper blocks
      # a downloaded build until it is opened from the right-click menu.
      # CSC auto-discovery stays off so a stray runner keychain identity is
      # never picked over the configured ad-hoc one.
      - name: Build macOS installers
        working-directory: electron
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npm run dist:mac -- --publish never

      - name: Upload macOS installers as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: prism-installers-mac-${{ github.ref_name }}
          path: electron/dist/*.dmg
          if-no-files-found: error

  # The only job that touches the Release. `if: always()` so a failed
  # best-effort build costs the release that one file, not the release.
  release:
    needs: [build, build-mac]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Collect the built installers
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          path: installers
          pattern: prism-installers-*
          merge-multiple: true

      # Create the release, or upload into it if it exists (a re-run to pick up
      # a fixed Windows build). --clobber replaces same-named assets.
      - name: Attach the installers to the release
        id: attach
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          installers=(installers/*.AppImage installers/*.rpm installers/*.deb installers/*.exe installers/*.dmg)
          # Read by installed copies' updaters, never by people. Globs rather
          # than literal names so nullglob drops a file that wasn't built. The
          # artifacts only ever hold latest.yml and latest-linux.yml: the mac
          # job uploads its .dmg files alone, since macOS copies can't update
          # in place (see the mac: block in electron-builder.yml).
          metadata=(installers/latest*.yml installers/*.blockmap)
          files=("${installers[@]}" "${metadata[@]}")

          # `count` is installers only: metadata without an installer to
          # describe is no release, and the check below should still fail it.
          echo "count=${#installers[@]}" >> "$GITHUB_OUTPUT"
          echo "Attaching ${#installers[@]} installer(s) and ${#metadata[@]} update file(s) to $TAG:"
          if [ ${#files[@]} -gt 0 ]; then
            printf '  %s\n' "${files[@]}"
          fi

          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "Release $TAG already exists, uploading into it."
            if [ ${#files[@]} -gt 0 ]; then
              gh release upload "$TAG" --repo "$REPO" --clobber "${files[@]}"
            fi
          else
            gh release create "$TAG" \
              --repo "$REPO" \
              --draft \
              --title "$TAG" \
              --generate-notes \
              "${files[@]}"
          fi

      # A release with no installers is a broken toolchain, not an intended
      # source-only release. Fail the run so it shows red.
      - name: Fail if no installers were attached
        if: steps.attach.outputs.count == '0'
        run: |
          echo "::error::No installers were attached to ${{ github.ref_name }}. Check the build jobs above."
          exit 1
